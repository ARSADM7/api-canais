<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060813">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CineStream Neon</title>
<style>
:root {
    --bg-main: #060813;
    --bg-card: rgba(15, 23, 42, 0.75);
    --bg-surface: rgba(20, 30, 50, 0.9);
    --neon-blue: #00f0ff;
    --neon-purple: #7000ff;
    --neon-pink: #ff00aa;
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
    --border-glow: rgba(0, 240, 255, 0.25);
    --success: #22c55e;
    --danger: #ef4444;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
}

body {
    background: var(--bg-main);
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0);
}

header {
    background: rgba(6, 8, 19, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 12px 12px;
    padding-top: max(12px, env(safe-area-inset-top, 0));
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(0, 240, 255, 0.15);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
}

.logo-app {
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, var(--neon-blue) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.logo-icon {
    font-size: 1.5rem;
}

.search-box {
    position: relative;
    max-width: 600px;
    margin: 0 auto 10px;
}

.search-box input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 25px;
    outline: none;
    font-size: 15px;
    color: #fff;
    transition: all 0.3s ease;
}

.search-box input:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--neon-blue);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
}

.search-box input::placeholder {
    color: var(--text-secondary);
}

.search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 16px;
}

.tabs {
    display: flex;
    gap: 4px;
    max-width: 600px;
    margin: 0 auto;
    background: rgba(0, 0, 0, 0.3);
    padding: 4px;
    border-radius: 12px;
}

.tab {
    flex: 1;
    padding: 10px 8px;
    background: transparent;
    border: none;
    border-radius: 9px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.25s ease;
}

.tab.active {
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
    color: #fff;
    box-shadow: 0 2px 12px rgba(0, 240, 255, 0.3);
}

.info-bar {
    margin-top: 10px;
    color: var(--text-secondary);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.info-bar b {
    color: var(--neon-blue);
}

.category-filter {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.category-filter::-webkit-scrollbar {
    display: none;
}

.category-chip {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.15);
    border-radius: 20px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s ease;
}

.category-chip.active {
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(0, 240, 255, 0.3);
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px 10px 100px;
}

.card {
    background: var(--bg-card);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 10px;
    border: 1px solid var(--border-glow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
    opacity: 0.5;
}

.card:active {
    transform: scale(0.95);
    border-color: var(--neon-blue);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
}

.card-fav-indicator {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 16px;
    z-index: 5;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
}

.logo-container {
    width: 100%;
    aspect-ratio: 16 / 10;
    margin-bottom: 8px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.logo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
}

.nome {
    text-align: center;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    min-height: 26px;
    color: #f1f5f9;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
}

.btn-play {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
    padding: 8px 0;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-blue) 100%);
    color: #fff;
    cursor: pointer;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-decoration: none;
    box-shadow: 0 2px 10px rgba(0, 240, 255, 0.3);
    transition: all 0.2s ease;
}

.btn-play:active {
    box-shadow: 0 0 15px var(--neon-blue);
    transform: scale(0.95);
}

.btn-disabled {
    background: rgba(255, 255, 255, 0.08);
    color: #64748b;
    box-shadow: none;
    cursor: not-allowed;
}

.loading {
    text-align: center;
    padding: 60px 20px;
    grid-column: 1 / -1;
    font-size: 14px;
    color: var(--neon-blue);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.loading-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(0, 240, 255, 0.2);
    border-top-color: var(--neon-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    grid-column: 1 / -1;
    color: var(--text-secondary);
}

.empty-state .icon {
    font-size: 3.5rem;
    margin-bottom: 14px;
    opacity: 0.5;
}

.empty-state p {
    font-size: 13px;
}

/* PLAYER OVERLAY */
.player-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 1000;
    display: none;
    flex-direction: column;
}

.player-overlay.active {
    display: flex;
}

.player-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    padding-top: max(12px, env(safe-area-inset-top, 0));
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(10px);
    z-index: 10;
}

.player-back {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s;
}

.player-back:active {
    background: rgba(255, 255, 255, 0.1);
}

.player-title {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-fav-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    padding: 6px;
    transition: transform 0.2s;
}

.player-fav-btn:active {
    transform: scale(0.85);
}

.player-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
}

.player-video {
    width: 100%;
    height: 100%;
    max-height: 100%;
    background: #000;
}

.player-loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--neon-blue);
}

.player-error {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--danger);
    padding: 20px;
}

.player-error .icon {
    font-size: 3rem;
    margin-bottom: 12px;
}

.player-error p {
    font-size: 13px;
    margin-bottom: 14px;
}

.player-retry {
    padding: 10px 24px;
    background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
    border: none;
    border-radius: 25px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

/* TOAST */
.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-surface);
    border: 1px solid var(--border-glow);
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    z-index: 2000;
    opacity: 0;
    transition: all 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* SCROLLBAR */
::-webkit-scrollbar {
    width: 4px;
}
::-webkit-scrollbar-track {
    background: var(--bg-main);
}
::-webkit-scrollbar-thumb {
    background: rgba(0, 240, 255, 0.2);
    border-radius: 2px;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.card {
    animation: fadeIn 0.3s ease forwards;
}

/* LANDSCAPE PLAYER */
@media (orientation: landscape) {
    .player-container {
        width: 100vw;
        height: 100vh;
    }
    .player-video {
        object-fit: contain;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo-app">
        <span class="logo-icon">🎬</span> CineStream Neon
    </div>
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="pesquisa" placeholder="Pesquisar canal..." autocomplete="off">
    </div>
    <div class="tabs">
        <button class="tab active" data-tab="canais">📺 Canais</button>
        <button class="tab" data-tab="favoritos">⭐ Favoritos</button>
    </div>
    <div class="info-bar">
        <span>Total: <b id="total">0</b></span>
        <span>|</span>
        <span>Favs: <b id="total-favs">0</b></span>
    </div>
</header>

<div class="category-filter" id="category-filter"></div>

<div id="lista" class="grid">
    <div class="loading" id="status-loading">
        <div class="loading-spinner"></div>
        Conectando à rede...
    </div>
</div>

<!-- PLAYER OVERLAY -->
<div class="player-overlay" id="player-overlay">
    <div class="player-header">
        <button class="player-back" id="player-back">✕</button>
        <span class="player-title" id="player-title">Reprodutor</span>
        <button class="player-fav-btn" id="player-fav-btn">☆</button>
    </div>
    <div class="player-container" id="player-container">
        <div class="player-loading" id="player-loading">
            <div class="loading-spinner"></div>
            <p style="margin-top:10px; font-size:12px;">Carregando stream...</p>
        </div>
        <video class="player-video" id="player-video" controls playsinline webkit-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="true" x5-video-orientation="landscape"></video>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const ENDPOINT_CHANNELS = "https://api-canais-opal.vercel.app/api/channels";
let todosCanais = [];
let favoritos = JSON.parse(localStorage.getItem('cinestream_favs') || '[]');
let currentTab = 'canais';
let currentCategory = 'Todos';
let currentChannel = null;
let playerTimeout = null;
let currentLista = [];
let searchTimeout = null;

const video = document.getElementById('player-video');
const playerOverlay = document.getElementById('player-overlay');
const playerTitle = document.getElementById('player-title');
const playerFavBtn = document.getElementById('player-fav-btn');
const playerLoading = document.getElementById('player-loading');
const playerContainer = document.getElementById('player-container');

// ============ API ============
async function carregarTudo() {
    const status = document.getElementById('status-loading');
    try {
        status.innerHTML = '<div class="loading-spinner"></div>Conectando...';
        const resInfo = await fetch(`${ENDPOINT_CHANNELS}?page=1&limit=1`);
        const info = await resInfo.json();
        const total = info.total || 2000;

        status.innerHTML = `<div class="loading-spinner"></div>Carregando ${total} canais...`;
        const resCompleta = await fetch(`${ENDPOINT_CHANNELS}?page=1&limit=${total}`);
        const dados = await resCompleta.json();
        todosCanais = dados.data || [];

        if (todosCanais.length < total) {
            let paginaAtual = 2;
            while (todosCanais.length < total) {
                status.innerHTML = `<div class="loading-spinner"></div>Sincronizando... (${todosCanais.length}/${total})`;
                const resPagina = await fetch(`${ENDPOINT_CHANNELS}?page=${paginaAtual}&limit=500`);
                const dadosPagina = await resPagina.json();
                if (!dadosPagina.data || dadosPagina.data.length === 0) break;
                todosCanais.push(...dadosPagina.data);
                paginaAtual++;
            }
        }

        document.getElementById('total').textContent = todosCanais.length;
        atualizarTotalFavs();
        gerarCategorias();
        mostrar(todosCanais);
    } catch (e) {
        console.error("Erro:", e);
        document.getElementById("lista").innerHTML =
        "<div class='empty-state'><div class='icon'>⚠️</div><p>Erro de conexão com o servidor.</p></div>";
    }
}

// ============ CATEGORIAS ============
function gerarCategorias() {
    const categorias = new Set();
    todosCanais.forEach(c => {
        if (c.group_title) categorias.add(c.group_title);
    });
    const cats = ['Todos', ...Array.from(categorias).sort()];
    const filter = document.getElementById('category-filter');
    filter.innerHTML = cats.map(cat => 
        `<span class="category-chip ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">${cat}</span>`
    ).join('');

    filter.querySelectorAll('.category-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            currentCategory = chip.dataset.cat;
            filter.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            filtrar();
        });
    });
}

// ============ FILTRAR ============
function filtrar() {
    const texto = document.getElementById('pesquisa').value.toLowerCase().trim();
    let lista = currentTab === 'favoritos' ? todosCanais.filter(c => favoritos.includes(c.id || c.url)) : todosCanais;

    if (currentCategory !== 'Todos') {
        lista = lista.filter(c => c.group_title === currentCategory);
    }

    if (texto) {
        lista = lista.filter(c =>
            (c.display_name || "").toLowerCase().includes(texto) ||
            (c.tvg_name || "").toLowerCase().includes(texto)
        );
    }

    mostrar(lista);
    document.getElementById('total').textContent = lista.length;
}

function getListaAtual() {
    const texto = document.getElementById('pesquisa').value.toLowerCase().trim();
    let lista = currentTab === 'favoritos' ? todosCanais.filter(c => favoritos.includes(c.id || c.url)) : todosCanais;
    if (currentCategory !== 'Todos') lista = lista.filter(c => c.group_title === currentCategory);
    if (texto) {
        lista = lista.filter(c =>
            (c.display_name || "").toLowerCase().includes(texto) ||
            (c.tvg_name || "").toLowerCase().includes(texto)
        );
    }
    return lista;
}

// ============ RENDER ============
function mostrar(lista) {
    const div = document.getElementById("lista");
    currentLista = lista;
    
    if (lista.length === 0) {
        const msg = currentTab === 'favoritos' 
            ? '<div class="icon">⭐</div><p>Nenhum favorito ainda.</p><p style="font-size:11px; margin-top:6px;">Toque no ☆ dos canais para salvar.</p>'
            : '<div class="icon">📡</div><p>Nenhum canal encontrado.</p>';
        div.innerHTML = `<div class="empty-state">${msg}</div>`;
        return;
    }

    div.innerHTML = lista.map((canal, i) => {
        const streamUrl = canal.url;
        const logoUrl = canal.tvg_logo;
        const nomeCanal = (canal.display_name || canal.tvg_name || 'Sem nome').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const canalId = (canal.id || canal.url).replace(/'/g, '\\\'');
        const isFav = favoritos.includes(canalId);
        const fallbackLogo = `https://placehold.co/100x60/0f172a/00f0ff?text=${encodeURIComponent(nomeCanal.substring(0, 3).toUpperCase())}`;
        const logoFinal = logoUrl && logoUrl !== "None" ? logoUrl : fallbackLogo;

        const botaoHTML = streamUrl 
            ? `<button class="btn-play" onclick="abrirPlayer(${i})">▶ ASSISTIR</button>`
            : `<button disabled class="btn-play btn-disabled">OFF</button>`;

        return `
        <div class="card" style="animation-delay: ${Math.min(i * 0.02, 0.5)}s" data-index="${i}">
            <div class="card-fav-indicator" onclick="toggleFav('${canalId}', event)">${isFav ? '⭐' : '☆'}</div>
            <div class="logo-container">
                <img class="logo" src="${logoFinal}" onerror="this.onerror=null;this.src='${fallbackLogo}';" alt="${nomeCanal}" loading="lazy">
            </div>
            <div class="nome" title="${nomeCanal}">${nomeCanal}</div>
            ${botaoHTML}
        </div>`;
    }).join('');
}

// ============ FAVORITOS ============
function toggleFav(id, event) {
    if (event) event.stopPropagation();
    const idx = favoritos.indexOf(id);
    if (idx > -1) {
        favoritos.splice(idx, 1);
        showToast('Removido dos favoritos');
    } else {
        favoritos.push(id);
        showToast('Adicionado aos favoritos ⭐');
    }
    localStorage.setItem('cinestream_favs', JSON.stringify(favoritos));
    atualizarTotalFavs();
    if (currentTab === 'favoritos') filtrar();
    else mostrarFiltrados();
}

function atualizarTotalFavs() {
    document.getElementById('total-favs').textContent = favoritos.length;
}

function mostrarFiltrados() {
    const lista = getListaAtual();
    mostrar(lista);
}

// ============ PLAYER ============
function abrirPlayer(index) {
    const lista = getListaAtual();
    const canal = lista[index];
    if (!canal || !canal.url) return;

    currentChannel = canal;
    const nomeCanal = canal.display_name || canal.tvg_name || 'Sem nome';
    const canalId = canal.id || canal.url;
    const isFav = favoritos.includes(canalId);

    playerTitle.textContent = nomeCanal;
    playerFavBtn.textContent = isFav ? '⭐' : '☆';
    playerOverlay.classList.add('active');
    playerLoading.style.display = 'block';
    video.style.display = 'none';
    document.body.style.overflow = 'hidden';

    if (playerTimeout) clearTimeout(playerTimeout);
    if (window.hlsInstance) { try { window.hlsInstance.destroy(); } catch(e){} window.hlsInstance = null; }

    const streamUrl = canal.url;
    const isHLS = streamUrl.includes('.m3u8') || streamUrl.includes('/live/');

    if (isHLS && typeof Hls !== 'undefined' && Hls.isSupported()) {
        const hls = new Hls({ 
            enableWorker: true, 
            lowLatencyMode: false,
            backBufferLength: 90,
            maxBufferLength: 30,
            maxMaxBufferLength: 600
        });
        window.hlsInstance = hls;
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            playerLoading.style.display = 'none';
            video.style.display = 'block';
            video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                switch(data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        showPlayerError();
                }
            }
        });
        playerTimeout = setTimeout(() => { if (video.paused && video.style.display === 'block') showPlayerError(); }, 20000);
    } else {
        video.src = streamUrl;
        video.style.display = 'none';
        video.load();
        video.oncanplay = () => {
            if (playerTimeout) clearTimeout(playerTimeout);
            playerLoading.style.display = 'none';
            video.style.display = 'block';
            video.play().catch(() => {});
        };
        video.onerror = () => showPlayerError();
        playerTimeout = setTimeout(() => { if (video.paused || video.ended) showPlayerError(); }, 20000);
    }

    video.onplaying = () => { if (playerTimeout) clearTimeout(playerTimeout); };
    video.onwaiting = () => { playerLoading.style.display = 'block'; };
    video.oncanplaythrough = () => { playerLoading.style.display = 'none'; };
}

function showPlayerError() {
    playerLoading.style.display = 'none';
    video.style.display = 'none';
    const existing = playerContainer.querySelector('.player-error');
    if (existing) return;
    const errDiv = document.createElement('div');
    errDiv.className = 'player-error';
    errDiv.innerHTML = `
        <div class="icon">📵</div>
        <p>Falha ao carregar o stream</p>
        <button class="player-retry" onclick="retryPlayer()">Tentar novamente</button>
    `;
    playerContainer.appendChild(errDiv);
}

function retryPlayer() {
    const errDiv = playerContainer.querySelector('.player-error');
    if (errDiv) errDiv.remove();
    if (currentChannel) {
        const lista = getListaAtual();
        const idx = lista.findIndex(c => (c.id || c.url) === (currentChannel.id || currentChannel.url));
        if (idx >= 0) abrirPlayer(idx);
        else fecharPlayer();
    }
}

function fecharPlayer() {
    video.pause();
    if (window.hlsInstance) {
        try { window.hlsInstance.destroy(); } catch(e){}
        window.hlsInstance = null;
    }
    video.removeAttribute('src');
    video.load();
    playerOverlay.classList.remove('active');
    const errDiv = playerContainer.querySelector('.player-error');
    if (errDiv) errDiv.remove();
    playerLoading.style.display = 'block';
    video.style.display = 'none';
    currentChannel = null;
    document.body.style.overflow = '';
}

document.getElementById('player-back').addEventListener('click', fecharPlayer);
playerFavBtn.addEventListener('click', () => {
    if (currentChannel) {
        const id = currentChannel.id || currentChannel.url;
        toggleFav(id);
        const isFav = favoritos.includes(id);
        playerFavBtn.textContent = isFav ? '⭐' : '☆';
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && playerOverlay.classList.contains('active')) fecharPlayer();
});

// ============ TABS ============
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        filtrar();
    });
});

// ============ SEARCH ============
document.getElementById('pesquisa').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(filtrar, 300);
});

// ============ TOAST ============
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ INIT ============
window.addEventListener('DOMContentLoaded', carregarTudo);
</script>
